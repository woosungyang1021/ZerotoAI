<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선 넘은 PM 단속반 — 시연</title>
<meta name="description" content="정상 반납·판정 보류·반납 거부 세 상황을 현장 영상과 앱 화면으로 동시에 재생합니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E141D; --panel:#161E2A; --panel-2:#1B2432; --rule:#283445;
  --ink:#E6EDF6; --ink-2:#8C9BB0; --ink-3:#5E6D82;
  --line:#FFD23F; --alert:#FF4D5E; --ok:#3DDC97; --warn:#FFA23F;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.hazard{height:5px;background:repeating-linear-gradient(115deg,var(--line) 0 14px,#0E141D 14px 28px);opacity:.85}
.shell{max-width:1500px;margin:0 auto;padding:0 20px 40px}

/* ── 헤더 ── */
.bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 0 14px;border-bottom:1px solid var(--rule)}
.mark{display:flex;flex-direction:column;gap:1px;margin-right:auto}
.mark b{font-size:19px;font-weight:800;letter-spacing:-.035em;border-left:3px solid var(--line);padding-left:9px}
.mark span{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.14em;padding-left:12px}
.stat{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.stat b{color:var(--ink);font-weight:500}
.led{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px rgba(61,220,151,.16);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.42}}
.back{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);text-decoration:none;border:1px solid var(--rule);
  border-radius:3px;padding:6px 11px;transition:border-color .14s,color .14s}
.back:hover{border-color:var(--ink-3);color:var(--ink)}

h2.title{font-size:16px;font-weight:750;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;margin:26px 0 4px}
h2.title::before{content:'';width:3px;height:15px;background:var(--line);flex:none}
.sub{color:var(--ink-2);font-size:13px;margin-bottom:9px;padding-left:13px;max-width:1000px}
.sub b{color:var(--ink);font-weight:700}

/* ── 모니터 월 ── */
.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mon{background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--ink-3);border-radius:3px;
  display:flex;flex-direction:column;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.mon.ok{border-top-color:var(--ok)} .mon.pending{border-top-color:var(--warn)} .mon.bad{border-top-color:var(--alert)}
.mon.hit{box-shadow:0 0 0 1px rgba(255,210,63,.4)}

.mhead{display:flex;align-items:center;gap:8px;padding:11px 13px 10px;border-bottom:1px solid var(--rule)}
.mhead .no{font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:var(--ink-3)}
.mhead .nm{font-size:13.5px;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.tag{font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:2px;white-space:nowrap;
  border:1px solid currentColor;opacity:.45;transition:opacity .25s}
.mon.hit .tag{opacity:1}
.tag.ok{color:var(--ok)} .tag.pending{color:var(--warn)} .tag.bad{color:var(--alert)}

/* 현장 영상 */
.field{position:relative;background:#000;aspect-ratio:16/9}
.field video{width:100%;height:100%;display:block;object-fit:cover}
.fl{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  color:rgba(230,237,246,.55);background:rgba(14,20,29,.55);padding:2px 6px;border-radius:2px}
.verdict{position:absolute;left:0;right:0;bottom:0;padding:9px 11px;font-family:var(--mono);font-size:11px;
  background:linear-gradient(transparent,rgba(14,20,29,.92) 45%);display:flex;align-items:center;gap:8px;
  opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.mon.hit .verdict{opacity:1;transform:none}
.verdict i{width:6px;height:6px;border-radius:50%;flex:none}
.verdict.ok i{background:var(--ok)} .verdict.pending i{background:var(--warn)} .verdict.bad i{background:var(--alert)}

/* 폰 */
.stage{display:flex;justify-content:center;padding:12px 13px 2px;background:var(--panel-2);flex:1}
/* 폰 크기는 --s 하나로 조절한다. 화면 안 치수가 px 로 흩어져 있어 값을 하나씩
   키우면 어긋나므로, 설계 크기(150x325.91)를 그대로 두고 통째로 확대한다.
   transform 은 자리를 차지하지 않으니 폰의 너비·높이는 직접 계산해 준다. */
.phone{--s:1.4;flex:none;
  width:calc(150px*var(--s) + 10px); height:calc(325.91px*var(--s) + 10px);
  border-radius:calc(14px*var(--s));border:1px solid #2E3948;background:#000;
  padding:5px;box-shadow:0 6px 22px rgba(0,0,0,.45)}
.screen{position:relative;width:150px;aspect-ratio:110/239;border-radius:15px;overflow:hidden;
  background:#fff;transform:scale(var(--s));transform-origin:top left}
.screen video{width:100%;height:100%;display:block;object-fit:cover}
.plabel{text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink-3);padding:6px 0 9px}

/* 재현 화면 */
/* 상태바 자리 비우기 — padding 의 % 는 '너비' 기준이라 높이와 어긋난다.
   상태바와 같은 6.49% '높이' 를 쓰려면 자리를 차지하는 상자로 밀어내야 한다. */
.ui{position:absolute;inset:0;background:#fff;color:#16181D;font-size:8.5px;display:none;flex-direction:column;word-break:keep-all}
.ui::before{content:'';flex:none;height:6.49%}
.ui.on{display:flex}
/* 상단은 그리지 않고 실제 녹화본에서 잘라 붙인다 — 세 폰이 픽셀 단위로 같아진다.
   상태바·아일랜드는 항상, 제목줄("1분 이용 중 80%")은 주행 중 화면에만. */
.statbar{position:absolute;left:0;right:0;top:0;height:6.49%;z-index:3;
  background:url('media/app-bar.jpg') top center/100% auto no-repeat}
.apptitle{flex:none;height:6.69%;background:url('media/app-title.jpg') top center/100% auto no-repeat}
.ui .ttl{font-size:12px;font-weight:700;letter-spacing:0;line-height:1.35;padding:6px 11px 0}
/* 구역 배너 — 실제 영상의 배너 자리(top 13.60%)에 이어 붙는다 */
.ui .zone{display:flex;align-items:center;gap:3px;margin:1.5px 9px 6px;padding:5px 6px;border-radius:8px;
  background:#EDF9F1;font-size:6.5px;font-weight:600;white-space:nowrap;overflow:hidden}
.ui .zone i{width:3.5px;height:3.5px;border-radius:50%;background:#00A868;flex:none}
.ui .zone b{margin-left:auto;color:#00A868}
/* 실제 녹화 폰 위에 같은 배너를 덧입힌다 — 영상 속 자리(top 13.6%, h 4.4%)를 덮는다 */
.overzone{position:absolute;left:2.5%;right:2.5%;top:13.4%;height:4.8%;z-index:2;display:none;
  align-items:center;gap:3px;padding:0 7px;border-radius:8px;background:#EDF9F1;
  color:#16181D;font-size:6.5px;font-weight:600;white-space:nowrap;overflow:hidden}
.overzone.on{display:flex}
.overzone i{width:3.5px;height:3.5px;border-radius:50%;background:#00A868;flex:none}
.overzone b{margin-left:auto;color:#00A868}
.ui .promo{display:flex;align-items:center;justify-content:center;gap:4px;margin:5px 9px 0;padding:3px 0;
  border-radius:5px;background:#FF8A00;color:#fff;font-size:6.5px;font-weight:700}
.ui .promo em{background:rgba(255,255,255,.28);border-radius:20px;padding:1px 4px;font-style:normal}
.ui .card{margin:5px 9px 0;padding:4px 2px 0}
.ui .r1{display:flex;align-items:center;justify-content:space-between;padding:3px 0 6px}
.ui .r1 .lt{display:flex;align-items:center;gap:3px;font-size:8px;font-weight:800}
.ui .r1 .lt em{color:#8A91A0;font-size:6.5px;font-weight:600;font-style:normal}
.ui .r1 .pill{border:1px solid #E4E7EC;border-radius:20px;padding:1px 5px;font-size:6.5px;font-weight:700;color:#6A7180}
.ui .basic{background:#FF8A00;color:#fff;border-radius:20px;padding:0 4px;font-size:5.5px;font-style:normal;font-weight:700}
.ui .minus{color:#FF8A00}
.ui .row.big{margin-top:3px;padding-top:5px;border-top:1px solid #F0F1F4}
.ui .row.big span{font-size:9px;font-weight:800;color:#16181D}
.ui .row.big b{font-size:11px;font-weight:800}
/* 지도 — 실제 반납구역 위성사진. 노란 네모 안이 허용 구역이고 바깥은 붉게 덮는다 */
.ui .map{position:relative;flex:none;aspect-ratio:260/208;margin:0 9px;border-radius:8px;overflow:hidden;
  background:url('media/zone-map-phone.jpg') center/cover no-repeat}
.ui .gpsbox{position:absolute;left:39.3%;top:42.1%;width:21.3%;height:15.9%;
  border:1px dashed #FF8A00;background:rgba(255,138,0,.12);
  box-shadow:0 0 0 999px rgba(255,59,48,.34)}
.ui .zonebox{position:absolute;left:43.8%;top:45.7%;width:12.3%;height:8.7%;
  border:1px solid #FF3B30;outline:1px solid rgba(255,255,255,.9)}
.ui .me{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;z-index:2;
  border-radius:50%;background:#2C7CF7;border:1.25px solid #fff;box-shadow:0 0 0 3px rgba(44,124,247,.26)}
.ui .rider{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:2;white-space:nowrap;
  background:#fff;border-radius:20px;padding:2px 7px;font-size:6px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.ui .refresh{position:absolute;right:5px;bottom:5px;z-index:2;width:14px;height:14px;border-radius:50%;
  background:#3A3F47;color:#fff;font-size:8px;display:flex;align-items:center;justify-content:center}
.ui .rows{padding:7px 11px 0}
.ui .row{display:flex;justify-content:space-between;padding:3px 0;color:#6A7180;font-size:7.5px}
.ui .row b{color:#16181D;font-weight:700}
.ui .cta{margin:auto 9px 10px;padding:8px 0;border-radius:9px;background:#16181D;color:#fff;
  text-align:center;font-size:9px;font-weight:700}
.ui .cta.wait{background:#E9EBEF;color:#8A91A0}
.ui .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 14px;text-align:center}
.ui .mid h4{font-size:11.5px;font-weight:800;letter-spacing:-.02em}
.ui .mid p{font-size:8px;color:#8A91A0;line-height:1.5}
.spin{width:17px;height:17px;border-radius:50%;border:2px solid #E4E7EC;border-top-color:#9AA2AF;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ui .cam{flex:1;background-size:cover;background-position:center;position:relative}
.ui .cam::after{content:'';position:absolute;left:50%;bottom:9px;width:26px;height:26px;margin-left:-13px;
  border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.45)}
.ui .camtip{position:absolute;left:8px;right:8px;top:8px;background:rgba(255,255,255,.94);border-radius:20px;
  padding:4px 8px;font-size:7px;font-weight:600;text-align:center}
.ui .res{margin:5px 9px 0;border-radius:9px;padding:9px 10px;font-size:8px;line-height:1.55}
.ui .res.bad{background:#FFF1F2;color:#B4232F} .ui .res.pending{background:#FFF7EC;color:#96601A}
.ui .res b{display:block;font-size:10.5px;font-weight:800;margin-bottom:3px}
.ui .map.sm{opacity:.55}
.ui .guide{margin:6px 9px 0;background:#F5F6F8;border-radius:8px;padding:6px 8px 7px}
.ui .gh{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.ui .gh b{font-size:7px;font-weight:800;color:#16181D}
.ui .gh em{margin-left:auto;font-style:normal;font-size:5.2px;font-weight:800;color:#2C7CF7;
  background:#E8F1FE;border-radius:20px;padding:1px 4px;letter-spacing:-.02em}
.ui .guide span{display:block;position:relative;padding-left:8px;font-size:6.2px;line-height:1.75;color:#6A7180}
.ui .guide span::before{content:'';position:absolute;left:2px;top:5px;width:2.5px;height:2.5px;
  border-radius:50%;background:#C3C8D2}
.ui .guide.check span::before{content:'✓';left:1px;top:0;width:auto;height:auto;
  background:none;color:#00A868;font-size:5.5px;font-weight:800}
.ui .navttl{text-align:center;font-size:8px;font-weight:800;padding:2px 0 5px}
.badgeSim{position:absolute;right:6px;bottom:6px;font-family:var(--mono);font-size:6.5px;letter-spacing:.08em;
  background:rgba(14,20,29,.72);color:#C8D3E2;padding:2px 5px;border-radius:2px}

/* 근거 */
.why{padding:10px 13px 12px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}

/* 관제 수신 — 이 케이스에서 관리주체 서버로 실제 넘어가는 것. 판정 전엔 대기, 판정 순간 갱신 */
.cc{margin:0 13px 12px;background:#0B1119;border:1px solid var(--rule);border-radius:3px;
  padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-height:86px}
.cchead{display:flex;align-items:center;gap:8px}
.cchead .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--ink-3);margin-right:auto}
.ccb{font-family:var(--mono);font-size:9.5px;font-weight:500;padding:2px 7px;border-radius:2px;border:1px solid;white-space:nowrap}
.ccb.waitb{color:var(--ink-3);border-color:rgba(94,109,130,.4);background:rgba(94,109,130,.08)}
.ccb.ok{color:var(--ok);border-color:rgba(61,220,151,.45);background:rgba(61,220,151,.1)}
.ccb.bad{color:var(--alert);border-color:rgba(255,77,94,.45);background:rgba(255,77,94,.1)}
.ccb.pending{color:var(--warn);border-color:rgba(255,162,63,.45);background:rgba(255,162,63,.1)}
.ccwait{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.ccgot{display:none;align-items:center;gap:9px}
.ccl{flex:1;min-width:0}
.ccl .l1{font-family:var(--mono);font-size:10px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccl .l2{font-family:var(--mono);font-size:9.5px;color:var(--ink-2);margin-top:2px}
.ccl .l3{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-top:3px}
.ccl .l3 b{color:#4DA6FF;font-weight:500}
.ccl .l3 em{font-style:normal;color:var(--alert)}
.ccclip{width:96px;flex:none;border-radius:2px;border:1px solid rgba(255,77,94,.4);display:block}
.mon.hit .ccgot{display:flex}
.mon.hit .ccwait,.mon.hit .ccb.waitb{display:none}
.cc .ccb.res{display:none}
.mon.hit .cc .ccb.res{display:inline-block}
.why b{color:var(--ink);font-weight:500}

/* ── 재생바 ── */
.deck{position:sticky;bottom:0;margin-top:14px;background:var(--panel);border:1px solid var(--rule);border-radius:3px;
  padding:11px 14px;display:flex;align-items:center;gap:13px;flex-wrap:wrap;z-index:5}
.pbtn{width:32px;height:32px;flex:none;border-radius:50%;border:1px solid var(--rule);background:var(--panel-2);
  cursor:pointer;position:relative;transition:border-color .14s}
.pbtn:hover{border-color:var(--ink-3)}
.pbtn::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  border-style:solid;border-width:6px 0 6px 10px;border-color:transparent transparent transparent var(--ink);margin-left:1px}
.pbtn.on::before{border:none;width:9px;height:10px;background:var(--ink);
  clip-path:polygon(0 0,3px 0,3px 100%,0 100%,0 0,6px 0,9px 0,9px 100%,6px 100%,6px 0)}
.track{flex:1;min-width:220px;height:5px;border-radius:3px;background:var(--rule);position:relative;cursor:pointer}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--line);border-radius:3px}
.mk{position:absolute;top:-4px;width:1px;height:13px;background:var(--ink-3)}
.mk::after{content:'판정';position:absolute;left:50%;transform:translateX(-50%);top:-13px;
  font-family:var(--mono);font-size:8.5px;color:var(--ink-3);white-space:nowrap}
.ptime{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.ptime b{color:var(--ink);font-weight:500}
.deck .note{font-family:var(--mono);font-size:10px;color:var(--ink-3);width:100%}

.foot{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;padding-top:14px;border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.foot b{color:var(--ink-2);font-weight:500}

@media (max-width:1080px){
  .wall{grid-template-columns:1fr}
  .phone{--s:1.62}
  .deck{position:static}
}
</style>
</head>
<body>
<div class="hazard"></div>
<div class="shell">

  <header class="bar">
    <div class="mark">
      <b>선 넘은 PM 단속반</b>
      <span>LIVE DEMO · 3 SCENARIOS</span>
    </div>
    <div class="stat"><i class="led"></i><span id="conn">3대 동시 재생</span></div>
    <div class="stat">구역 <b>유억겸 기념관 앞</b></div>
    <a class="back" href="index.html">← 판정 리포트</a>
  </header>

  <h2 class="title">반납 판정 시연</h2>
  <p class="sub">GPS로는 셋 다 정상 반납 — 카메라가 보면 <b>승인 · 보류 · 거부</b>로 갈립니다.</p>

  <div class="wall" id="wall"></div>

  <div class="deck">
    <button class="pbtn on" id="bPlay" type="button" aria-label="일시정지"></button>
    <div class="track" id="track"><div class="fill" id="fill"></div><div class="mk" id="mk"></div></div>
    <span class="ptime"><b id="tNow">0:00</b> / <span id="tEnd">0:23</span></span>
    <p class="note" id="deckNote">—</p>
  </div>

  <div class="foot">
    <span>모델 <b>YOLO26m-seg</b></span>
    <span>디바이스 <b>Jetson Orin Nano</b></span>
    <span>현장 영상 <b>3편 · 1280px</b></span>
    <span><a href="index.html">판정 리포트</a></span>
    <span><a href="https://github.com/woosungyang1021/ZerotoAI">GitHub</a></span>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const LOOP = 23.5;          // 세 영상의 공통 길이
const HIT  = 22.0;          // 판정이 떨어지는 지점

/* 앱 흐름 — 실제 녹화본(정상 반납)의 화면 전환 시각을 그대로 따른다.
   보류·거부는 녹화본이 없어 같은 리듬으로 재현한다. */
const FLOW = { ride:9.9, prep:13.7, shot:15.2, wait:19.1, done:HIT };

const SCEN = [
  {
    id:'ok', kind:'ok', no:'CASE 01', nm:'정상 반납', tag:'반납 승인',

/* ── 화면 짓기 ── */
$('wall').innerHTML = SCEN.map((s,i) => `
  <div class="mon ${s.kind}" id="mon${i}">
    <div class="mhead">
      <span class="no">${s.no}</span>
      <span class="nm">${s.nm}</span>
      <span class="tag ${s.kind}">${s.tag}</span>
    </div>
    <div class="field">
      <video id="v${i}" muted playsinline preload="auto"><source src="${s.src}" type="video/mp4"></video>
      <div class="fl">CAM 01 · 2 FPS</div>
      <div class="verdict ${s.kind}"><i></i><span>${s.verdict}</span></div>
    </div>
    <div class="stage">
      <div class="phone"><div class="screen">${phoneMarkup(s,i)}</div></div>
    </div>
    <p class="plabel">${s.phone.real ? '실제 앱 화면 녹화' : '앱 연동 재현 화면'}</p>
    <div class="cc">
      <div class="cchead">
        <span class="lbl">관제 수신</span>
        <span class="ccb waitb">대기</span>
        <span class="ccb res ${s.cc.cls}">${s.cc.b}</span>
      </div>
      <div class="ccwait">영상 스트림 없음 — 판정 결과만 전송됩니다</div>
      <div class="ccgot">
        <div class="ccl">
          <div class="l1">${s.cc.l1}</div>
          <div class="l2">${s.cc.l2}</div>
          ${s.cc.l3?`<div class="l3">${s.cc.l3}</div>`:''}
        </div>
        ${s.cc.clip?`<video class="ccclip" id="ccclip" muted playsinline preload="metadata"
          src="media/case2-on-the-line.mp4#t=18.8,26.8" poster="media/case2-on-the-line.jpg"></video>`:''}
      </div>
    </div>
    <div class="why">${s.why}</div>
  </div>`).join('');

function phoneMarkup(s,i){
  if(s.phone.real)
    return `<video id="p${i}" muted playsinline preload="auto" poster="${s.phone.poster}">
              <source src="${s.phone.real}" type="video/mp4"></video>
            <div class="overzone"><i></i>서대문구 신촌동 <b>반납 허가 구역 진입</b></div>`;
  // 재현 화면 — 주행 중 / 준비 / 촬영 / 처리 / 결과.
  // 상단 상태바와 아일랜드는 화면이 바뀌어도 그대로 남는다.
  const me = `style="left:${s.phone.me[0]}%;top:${s.phone.me[1]}%"`;
  const MAP = extra => `
      <div class="map${extra||''}">
        <div class="gpsbox"></div><div class="zonebox"></div><div class="me" ${me}></div>
        ${extra ? '' : '<span class="rider">라이더 추가</span><span class="refresh">↻</span>'}
      </div>`;
  return `
    <div class="ui" data-st="ride">
      <div class="apptitle"></div>
      <div class="zone"><i></i>서대문구 신촌동 <b>반납 허가 구역 진입</b></div>
      ${MAP()}
      <div class="promo"><em>Basic</em> 10분까지 1,000원 적용 중</div>
      <div class="card">
        <div class="r1"><span class="lt">⚡ 전기 동력 사용 <em>터보</em></span><span class="pill">230원/분</span></div>
        <div class="row"><span>결제수단</span><b></b></div>
        <div class="row"><span>할인/포인트 <em class="basic">Basic</em></span><b class="minus">−430원</b></div>
        <div class="row big"><span>예상 요금</span><b>1,000원</b></div>
      </div>
      <div class="cta" data-cta>주행 종료하기</div>
    </div>
    <div class="ui" data-st="prep">
      <div class="mid"><h4>반납 준비 중이에요</h4><p>앱을 종료하지 말고 기다려 주세요.</p><div class="spin"></div></div>
    </div>
    <!-- 촬영 화면은 판정 결과와 무관하게 실제 앱에서 동일하다. 사진은 실제 앱
         녹화에서 잘라낸 것을 세 폰이 함께 쓴다 — 이용자가 낸 사진만으로는
         세 상황이 구분되지 않는다는 점이 이 시연의 요지이기도 하다. -->
    <div class="ui" data-st="shot">
      <div class="navttl">반납 사진 촬영</div>
      <div class="cam" style="background-image:url('${s.phone.cam}')">
        <div class="camtip">✋ 견인 구역에 반납하지 않으려면?</div>
      </div>
    </div>
    <div class="ui" data-st="wait">
      <div class="mid"><div class="spin"></div><p>주차 상태를 확인하고 있어요</p></div>
    </div>
    <div class="ui" data-st="done">
      <div class="ttl">${s.phone.title}</div>
      <div class="res ${s.phone.res}">${s.phone.body}</div>
      ${MAP(' sm')}
      ${s.phone.guide ? `
        <div class="guide${s.phone.guide.check?' check':''}">
          <div class="gh"><b>${s.phone.guide.h}</b><em>AI 주차 확인</em></div>
          ${s.phone.guide.items.map(t=>`<span>${t}</span>`).join('')}
        </div>` : ''}
      <div class="cta ${s.phone.res==='pending'?'wait':''}">${s.phone.res==='pending'?'확인':'다시 주차하기'}</div>
    </div>
    <div class="statbar"></div>
    <span class="badgeSim">재현</span>`;
}

const mons = SCEN.map((_,i)=>$('mon'+i));
const vids = SCEN.map((_,i)=>$('v'+i));
const app  = $('p0');                     // 정상 반납만 실제 앱 녹화
let playing = true;

/* ── 시계는 첫 영상이 쥔다 ── */
const master = () => Math.max(0, Math.min(LOOP, vids[0].currentTime - SCEN[0].clip));

function seekAll(t){
  vids.forEach((v,i)=>{ v.currentTime = SCEN[i].clip + t; });
  syncApp(t, true);
}

function syncApp(t, force){
  const a = SCEN[0].phone.at;
  if(t < a){                                   // 아직 반납을 누르기 전 — 첫 화면에서 대기
    if(!app.paused) app.pause();
    if(force || app.currentTime > 0.05) app.currentTime = 0;
    return;
  }
  const want = t - a;
  const hold = SCEN[0].phone.hold;
  if(hold && want >= hold){                    // 완료 화면에서 멈춘다 — 홈으로 넘어가지 않게
    if(Math.abs(app.currentTime - hold) > 0.1) app.currentTime = hold;
    if(!app.paused) app.pause();
    return;
  }
  if(want >= app.duration - 0.05){ app.pause(); return; }
  if(force || Math.abs(app.currentTime - want) > 0.4) app.currentTime = want;
  if(playing && app.paused) app.play().catch(()=>{});
}

/* 관제 수신 스트립 — 판정 순간에 열리고, 거부 증거 클립(판정 전후 4초)이 함께 돈다 */
let hitState=null;
function setHit(on){
  if(on===hitState) return;
  hitState=on;
  mons.forEach(m=>m.classList.toggle('hit', on));
  const c=$('ccclip');
  if(c){
    if(on){ if(c.currentTime<18.7||c.currentTime>26.9) c.currentTime=18.8; c.play().catch(()=>{}); }
    else c.pause();
  }
}

function paintPhones(t){
  const st = t < FLOW.prep ? 'ride' : t < FLOW.shot ? 'prep'
           : t < FLOW.wait ? 'shot' : t < FLOW.done ? 'wait' : 'done';
  SCEN.forEach((s,i)=>{
    const root = mons[i];
    if(s.phone.real){                       // 실제 녹화 폰 — 주행 화면 동안 구역 안내만 덧입힌다
      root.querySelector('.overzone').classList.toggle('on', t < FLOW.prep);
      return;
    }
    root.querySelectorAll('.ui').forEach(u=>u.classList.toggle('on', u.dataset.st===st));
    const cta = root.querySelector('[data-cta]');
    if(cta) cta.classList.toggle('wait', t >= FLOW.ride);   // 버튼을 누른 뒤 대기 모양
  });
}

function tick(){
  if(ended){ requestAnimationFrame(tick); return; }   // 결과를 띄워 둔 동안은 손대지 않는다
  const t = master();
  // 드리프트 보정 — 첫 영상을 기준으로 나머지를 붙인다
  for(let i=1;i<vids.length;i++){
    const want = SCEN[i].clip + t;
    if(Math.abs(vids[i].currentTime - want) > 0.4) vids[i].currentTime = want;
  }
  syncApp(t, false);
  paintPhones(t);
  setHit(t >= HIT);

  $('fill').style.width = (t/LOOP*100).toFixed(2)+'%';
  $('tNow').textContent = '0:'+String(Math.floor(t)).padStart(2,'0');
  $('deckNote').textContent = t >= HIT
    ? '판정 확정 — 승인 / 보류 / 거부가 같은 순간에 갈렸습니다.'
    : `판정까지 ${(HIT-t).toFixed(1)}초`;

  // 끝나면 되감지 않고 결과 화면(체크리스트)을 그대로 남긴다
  if(!ended && t >= LOOP - 0.05) endAll();
  requestAnimationFrame(tick);
}

let ended = false;                          // 끝에 멈춰 결과를 띄워 둔 상태

function endAll(){
  ended = true;
  pauseAll();
  paintPhones(LOOP);                        // 세 폰 모두 결과 화면으로 고정
  setHit(true);
  $('fill').style.width = '100%';
  $('tNow').textContent = '0:'+Math.round(LOOP);
  $('bPlay').setAttribute('aria-label','처음부터 다시 재생');
  $('deckNote').textContent = '판정 확정 — 승인 / 보류 / 거부가 같은 순간에 갈렸습니다. 다시 보려면 재생을 누르세요.';
}

function playAll(){
  if(ended){ ended = false; seekAll(0); }   // 끝에서 누르면 처음부터
  playing = true;
  $('bPlay').classList.add('on');
  $('bPlay').setAttribute('aria-label','일시정지');
  // 자동재생을 막는 브라우저가 있다 — 실패하면 정지 상태로 되돌리고 알린다
  Promise.allSettled(vids.map(v=>v.play())).then(rs=>{
    if(rs.some(r=>r.status==='rejected')){
      playing = false;
      $('bPlay').classList.remove('on');
      $('bPlay').setAttribute('aria-label','재생');
      $('conn').textContent = '재생 버튼을 눌러 주세요';
    }
  });
}
function pauseAll(){
  playing = false;
  $('bPlay').classList.remove('on');
  $('bPlay').setAttribute('aria-label','재생');
  vids.forEach(v=>v.pause()); app.pause();
}
$('bPlay').onclick = () => playing ? pauseAll() : playAll();
{ const c=$('ccclip');
  if(c) c.addEventListener('timeupdate',()=>{ if(c.currentTime>=26.8) c.currentTime=18.8; }); }

$('track').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  ended = false;
  seekAll(Math.max(0, Math.min(LOOP, (e.clientX-r.left)/r.width*LOOP)));
};
$('mk').style.left = (HIT/LOOP*100)+'%';
$('tEnd').textContent = '0:'+Math.round(LOOP);

/* ── 준비되면 출발 ── */
let ready = 0, started = false;
function start(){
  if(started) return;
  started = true;
  seekAll(0); playAll(); requestAnimationFrame(tick);
}
[...vids, app].forEach(v => v.addEventListener('loadeddata', () => {
  if(++ready === vids.length + 1) start();
}, {once:true}));
setTimeout(start, 4000);            // 한 편이 늦어도 나머지는 돌린다

addEventListener('keydown', e => {
  if(e.code === 'Space' && e.target === document.body){ e.preventDefault(); playing ? pauseAll() : playAll(); }
});
</script>
